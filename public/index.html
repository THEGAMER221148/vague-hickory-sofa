<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Vague Hickory Sofa</title>
        <script src="main.js" type="module" defer></script>
    </head>
    <style>
        body {
            margin: 0%;
            padding: 0%;
            overflow: hidden;
        }
        #gameCanvas {
            display: block;
            image-rendering: crisp-edges;
            image-rendering: pixelated;
            z-index: 0;
            position: fixed;
        }
        #mainMenu {
            width: 100%;
            height: 100%;
            left: 0%;
            top: 0%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 10;
            display: block;
            position: fixed;
            align-content: center;
            text-align: center;
            color: rgb(255, 255, 255);
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.2rem;
        }
        h1 {
            font-weight: bolder;
        }
        p {
            font-weight: bold;
        }
        #nameInput,
        #startButton {
            padding: 0.4em 0.6em;
            border: 1px solid rgba(255, 255, 255, 0.7);
            border-radius: 0.25em;
            background-color: rgba(0, 0, 0, 0.5);
            color: rgb(255, 255, 255);
            font: inherit;
            font-weight: bold;
        }
        #startButton {
            cursor: pointer;
        }
        #startButton:hover,
        #startButton:focus-visible {
            background-color: rgba(255, 255, 255, 0.2);
            border-color: rgb(255, 255, 255);
        }
        #chatPanel {
            position: fixed;
            left: 1rem;
            bottom: 1rem;
            z-index: 5;
            display: none;
            width: min(24rem, calc(100vw - 2rem));
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.7);
            border-radius: 0.25rem;
            background-color: rgba(0, 0, 0, 0.5);
            color: rgb(255, 255, 255);
            font-family: 'Courier New', Courier, monospace;
            font-size: 1rem;
        }
        #chatTitle {
            margin: 0;
            padding: 0.5rem 0.75rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.35);
            font-size: 1rem;
        }
        #chatMessages {
            display: flex;
            height: 10rem;
            margin: 0;
            padding: 0.6rem 0.75rem;
            overflow-y: auto;
            flex-direction: column;
            gap: 0.35rem;
            list-style: none;
            scrollbar-color: rgba(255, 255, 255, 0.6) transparent;
        }
        .chatMessage {
            overflow-wrap: anywhere;
        }
        .chatAuthor {
            font-weight: bold;
        }
        .chatSystemMessage {
            color: rgba(255, 255, 255, 0.75);
            font-style: italic;
        }
        #chatForm {
            display: flex;
            border-top: 1px solid rgba(255, 255, 255, 0.35);
        }
        #chatInput,
        #chatSend {
            border: 0;
            background-color: rgba(0, 0, 0, 0.35);
            color: rgb(255, 255, 255);
            font: inherit;
            font-weight: bold;
        }
        #chatInput {
            min-width: 0;
            padding: 0.6rem 0.75rem;
            flex: 1;
            outline: none;
        }
        #chatInput::placeholder {
            color: rgba(255, 255, 255, 0.65);
        }
        #chatInput:focus-visible {
            background-color: rgba(255, 255, 255, 0.12);
            box-shadow: inset 0 0 0 1px rgb(255, 255, 255);
        }
        #chatSend {
            padding: 0.6rem 0.85rem;
            border-left: 1px solid rgba(255, 255, 255, 0.35);
            cursor: pointer;
        }
        #chatSend:hover,
        #chatSend:focus-visible {
            background-color: rgba(255, 255, 255, 0.2);
        }
    </style>
    <body>
        <canvas id="gameCanvas"></canvas>
        <div id="mainMenu">
            <h1>Welcome to Vague Hickory Sofa!</h1>
            <p>Before you begin, let's get you a name:</p>
            <input type="text" id="nameInput" maxlength="16" minlength="2" placeholder="Enter Username">
            <button id="startButton">Hop In!</button>
            <p><i>Names must be between 2 and 16 characters in length.</i></p>
            <p>And while you're at it, choose a color too!</p>
            <input type="color" id="colorInput" value="rgb(80,150,255)">
            <p><i>Click the color box above to change your color.</i></p>
        </div>
        <section id="chatPanel" aria-label="Game chat" aria-hidden="true">
            <h2 id="chatTitle">Chat</h2>
            <ul id="chatMessages" aria-live="polite" aria-relevant="additions"></ul>
            <form id="chatForm" autocomplete="off">
                <input type="text" id="chatInput" maxlength="160" placeholder="Press / to chat" aria-label="Chat message">
                <button type="submit" id="chatSend">Send</button>
            </form>
        </section>
    </body>
</html>
